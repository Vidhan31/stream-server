[package]
name = "async-sevenz"
version = "0.1.8"
edition = "2021"

[dependencies]
autocxx = "0.31"
cxx = "1.0"
tokio = { version = "1.54.1", features = ["rt", "sync", "io-util"] }

[build-dependencies]
autocxx-build = "0.31"
cc = "1.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
