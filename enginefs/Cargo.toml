[package]
name = "enginefs"
version = "0.1.8"
edition = "2024"

[dependencies]
libtorrent-sys = { path = "../bindings/libtorrent-sys", optional = true }
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "sync",
    "process",
    "test-util",
] }
tokio-util = { version = "0.7.20", features = ["rt"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1"
async-trait = "0.1.92"
bytes = "1.12.2"
futures = "0.3.34"
url = "2.5.8"
regex = "1.13.2"
anyhow = "1.0.104"
moka = { version = "0.12.16", features = ["future", "sync"] }
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
parking_lot = "0.13.0"

[features]
default = ["libtorrent"]
libtorrent = ["dep:libtorrent-sys"]
