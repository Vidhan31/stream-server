[workspace]
resolver = "2"
members = [
    "enginefs",
    "server",
    "bindings/async-rar",
    "bindings/libtorrent-sys",
    "bindings/async-sevenz",
    "stremio-runtime-stub",
    "updater-helper",
]
exclude = ["settings-gui"]
default-members = ["server"]

[workspace.dependencies]
tokio = { version = "1.54.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
tracing = "0.1"
reqwest = { version = "0.13.5", default-features = false }
url = "2.5.8"
regex = "1.13.2"
bytes = "1.12.2"
futures-util = "0.3.34"
tokio-util = "0.7.20"
uuid = "1.29.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
undocumented_unsafe_blocks = "warn"
fn_params_excessive_bools = "allow"
clone_on_ref_ptr = "allow"
redundant_clone = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"

# Noise suppression consistent with codebase architecture
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
if_not_else = "allow"
unnested_or_patterns = "allow"
unused_async = "allow"
uninlined_format_args = "allow"
doc_markdown = "allow"
module_inception = "allow"
enum_glob_use = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
single_match_else = "allow"
match_same_arms = "allow"
ignored_unit_patterns = "allow"
manual_let_else = "allow"
implicit_clone = "allow"
items_after_statements = "allow"
used_underscore_binding = "allow"
case_sensitive_file_extension_comparisons = "allow"
struct_field_names = "allow"
needless_pass_by_value = "allow"
match_wildcard_for_single_variants = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
